<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__photo" src="{{ '/assets/img/profile.png' | relative_url }}" alt="" width="32" height="32">
      <span class="brand__name">{{ site.short_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.data.nav -%}
        {%- assign active = false -%}
        {%- if item.url == '/' and page.url == '/' -%}{%- assign active = true -%}
        {%- elsif item.url != '/' and page.url contains item.url -%}{%- assign active = true -%}
        {%- endif -%}
        <a class="site-nav__link{% if active %} is-active{% endif %}" href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
