- id: toppan
  title: AI/ML Engineer
  org: Toppan Next Tech
  location: Singapore
  dates: May 2023 – Jul 2024
  scope: Vehicle and biometric AI MVPs for immigration-checkpoint use cases; took the vehicle-screening system to live use at Toppan's own security gate entrance.
  highlights:
    - title: Passenger counting
      text: Combined cameras with 60GHz radar, since cameras alone miss occupants hidden from view. Near-100% passenger-count accuracy on standard vehicles in live use at the gate.
    - title: Vehicle attributes
      text: OpenAI GPT-4 extracts each car's model as a structured field; deep-learning models classify car colour and driver demographics. On-premises fallback model where data cannot go to an external API.
    - title: Data pipeline and deployment
      text: Defined the pipeline from the security system's RF and camera sensors to cleaned, annotated training data; deployed the detection and counting models on edge servers.
    - title: Integration
      text: Worked with full-stack developers to integrate the models into the wider security system; deployed GPT-4o assistants with LangChain.
    - title: Team
      text: Supervised interns on data collection and annotation, in Agile Scrum.
  stack: [OpenAI GPT-4 / GPT-4o, LangChain, 60GHz radar, computer vision, edge servers]

