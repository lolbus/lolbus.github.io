- id: ai6102-kinship
  group: msc
  title: 'Kaggle’s Kinship Recognition Challenge: Introduction of Convolution-Free Model to boost conventional ensemble classifier'
  meta: NTU, Singapore, Machine Learning & Applications Project, Jan 2022 – Apr 2022
  context: '(School Final Assignment for Course: AI6102, Machine Learning & Applications. Conduct a research project related to machine learning)'
  bullets:
  - text: Proposed an alternative strategy to optimize ensemble learning final output by combining predictions from CNN variants and Vision Transformer variants, instead of only CNN variants designed to have minimal correlation with each other.
  - text: Tested the proposed methods on a 2016 Kaggle Competition titled, Northeastern SMILE Lab -Recognizing Faces in the Wild
  - text: Evaluated performance of the proposed method by evaluating the correlation of outputs from the two models’ variants and the final test score after applying ensemble learning on the outputs of the two kinds of model variants
  - text: Proven that the Vision Transformer model variants output has a lower correlation to the CNN model variants as compared to the CNN model variants output correlation to other CNN model variants
  - text: Awarded A+ Grade for Machine Learning & Applications course in NTU MSAI Program
  - text: Awarded Best Presenter Award (Senior) and SGD300 at STCAI Conference Sharing, 25 June 2022
  files:
  - label: Final Report PDF
    url: /ML6102Project.pdf
- id: ai6103-embeddings
  group: msc
  title: Reimplementation of “Joint Learning of Character and Word Embeddings”
  meta: NTU, Singapore, Deep Learning & Applications Project Aug 2021 – Nov 2021
  context: '(School Final Assignment for Course AI6103, Deep learning & Applications. Assignment Task: Take a conference paper (AAAI, IJCAI, ICML, NeurIPS, ICLR, CVPR, ICCV NAACL, ACL, etc ) from 2015. Reimplement the algorithm in that paper. No existing source code is allowed)'
  bullets:
  - text: Reimplementation of paper “Joint Learning of Character and Word Embeddings” algorithm using PyTorch framework successfully
  - text: In this reimplementation, a new type of ‘Chinese Character’ token ID input was added to the original CBOW word embedding model
  - text: Training Corpus was prepared by combining multiple free public corpora online based on articles in Wikipedia and Newspaper.
  - text: Validation and Test performance evaluated based on word relatedness test using Spearman correlation metrics and Analogy Reasoning using % accuracy.
  - text: Discover that modified CBOW generally outperforms conventional CBOW reimplementation, consistent with the original conference paper. However, the modified CBOW model losses performance superiority with a larger number of vocabularies to total words ratio in the training corpus.
  - text: Awarded A+ Grade for Deep Learning & Applications course in NTU MSAI Program
