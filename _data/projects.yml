- id: runescape-bots
  group: early
  title: Self-Initiated Project – Gaming Bot writer (Part time), Jan 2011 – Dec 2013
  bullets:
  - text: While studying at Poly, wrote programming codes in Java for MMORPG Runescape game bots to carry out automated instructions repetitively to achieve desired outcomes in the computer game.
  - text: Utilize gaming bots to intelligently play the game and farm in-game currency by hosting numerous automated bots on virtual private servers to play the Runescape game which was originally meant for real life humans.
  - text: Overcome game developers automated anti-cheat systems by adding extra redundant human-like behavior into the bot design to avoid detection. (Trial and error from failures when a bot account got banned due to obvious bot behaviors)
  - text: Take part in online discussions on how to improve bot behavior to escape detection from Game developers or to perform gaming tasks efficiently.
  - text: Assist/Troubleshoot other users in the online community trying to write their own code (Learn via teaching)
  - text: Profited approx. 10,000 SGD by farming and collating in-game currency and then re-sell them to real life users from 2011 to 2013.
  - text: All botting accounts were completely blasted by Game Developers, following an automated anti-cheat system update in 2017 marking the end of the self-interest research project.
