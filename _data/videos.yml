# Videos page index. Videos stay on YouTube (unlisted is fine) or Google Drive; only this list lives in the repo.
# Fields:
#   id:          unique, lowercase-with-dashes; the page anchor is /videos/#<id>
#   title:       as shown on the card
#   date:        YYYY-MM-DD (shown as "Mon YYYY"; also sets the sort order)
#   date_label:  optional text shown instead of the date, e.g. a role period "Oct 2020 – Mar 2021"
#   youtube_id:  the part after watch?v=   (use this OR url)
#   url:         full link for Google Drive or other hosts
#   duration:    optional, e.g. "6:42"
#   org:         employer or institution
#   summary:     one line on what the video shows
#   tags:        list, used by the filter chips and search
#   roles:       list of role ids from _data/experience.yml  (adds the video to that role's Videos tab)
#   projects:    list of project ids from _data/projects.yml (adds the video to that project's Videos tab)
#
