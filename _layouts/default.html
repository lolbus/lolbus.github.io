<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" class="no-js">
  {%- include head.html -%}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {%- include header.html -%}
    <main id="main" class="site-main">
      {{ content }}
    </main>
    {%- include footer.html -%}
    <dialog class="lightbox" id="lightbox" aria-label="Image viewer">
      <form method="dialog"><button class="lightbox__close" aria-label="Close">×</button></form>
      <img class="lightbox__img" src="" alt="">
      <p class="lightbox__caption"></p>
    </dialog>
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
