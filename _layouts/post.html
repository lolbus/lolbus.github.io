---
layout: default
---
<div class="wrap wrap--narrow">
  <article class="post">
    <header class="page-head">
      <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.date_format }}</time></p>
      <h1 class="page-title page-title--post">{{ page.title | escape }}</h1>
    </header>
    <div class="prose">{{ content }}</div>
    <p class="post__back"><a href="{{ '/' | relative_url }}#updates">← All updates</a></p>
  </article>
</div>
